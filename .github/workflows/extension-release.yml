name: Extension release artifact

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate semantic version tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          node -e "const m=require('./extension/manifest.json'); if ('v'+m.version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - run: node extension/build.mjs
      - run: node extension/package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rdap-human-viewer-${{ github.ref_name }}-extension
          path: dist/rdap-human-viewer-${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 90
