name: Publish Docker image

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version to publish (for example, 1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'realvorl/rdap-h'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node web/build.mjs
      - run: node extension/build.mjs
      - run: node extension/package.mjs
      - run: node --test core/tests/*.test.js extension/tests/*.test.js web/tests/*.test.js tests/*.test.js
      - name: Check JavaScript syntax
        run: find core extension web tests site -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
  publish:
    needs: validate
    if: >-
      ${{
        github.repository == 'realvorl/rdap-h' &&
        (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Select and validate stable version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a published version tag
        env:
          IMAGE: ghcr.io/realvorl/rdap-h
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "Version tag $VERSION already exists; refusing to overwrite it." >&2
            exit 1
          fi
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/realvorl/rdap-h
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=RDAP Human Viewer
            org.opencontainers.image.description=Privacy-first, browser-side RDAP viewer served as a static web application.
            org.opencontainers.image.source=https://github.com/realvorl/rdap-h
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
