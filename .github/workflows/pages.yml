name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [Continuous integration]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node web/build.mjs
      - if: github.event_name == 'workflow_dispatch'
        run: node extension/build.mjs
      - if: github.event_name == 'workflow_dispatch'
        run: node extension/package.mjs
      - if: github.event_name == 'workflow_dispatch'
        run: node --test core/tests/*.test.js extension/tests/*.test.js web/tests/*.test.js tests/*.test.js
      - name: Check JavaScript syntax
        if: github.event_name == 'workflow_dispatch'
        run: find core extension web tests site -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Report deployed URL
        run: |
          echo "Deployed to ${{ steps.deployment.outputs.page_url }}"
          echo "[Open GitHub Pages](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"
