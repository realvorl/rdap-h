name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'core/**'
      - 'web/**'
      - 'extension/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node extension/build.mjs
      - run: node web/build.mjs
      - run: node --test core/tests/*.test.js extension/tests/*.test.js web/tests/*.test.js
      - run: node --check core/rdap.js && node --check core/renderer.js && node --check web/src/app.js && node --check extension/src/content.js && node --check extension/build.mjs && node --check web/build.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node web/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
