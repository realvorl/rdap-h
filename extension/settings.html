<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RDAP, but for Humans Settings</title>
  <style>
    :root{font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#172332;background:#f8fafc;color-scheme:light dark}
    @media(prefers-color-scheme:dark){:root{color:#e9f2fa;background:#101820}}
    *{box-sizing:border-box}body{max-width:680px;margin:0 auto;padding:32px 20px}h1{font-size:26px;line-height:1.2}p{color:#64748b}@media(prefers-color-scheme:dark){p{color:#afc0cf}}
    fieldset{border:1px solid #dce4ec;border-radius:8px;padding:18px;margin:24px 0} @media(prefers-color-scheme:dark){fieldset{border-color:#324450}}
    label{display:block;padding:9px 0;font-weight:650}label span{display:block;margin:2px 0 0 26px;font-size:13px;font-weight:400;color:#64748b}@media(prefers-color-scheme:dark){label span{color:#afc0cf}}
    input{accent-color:#156b8c}button{border:0;border-radius:5px;background:#156b8c;color:#fff;padding:9px 16px;font:600 14px system-ui,sans-serif;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #156b8c;outline-offset:3px}#save-status{display:inline-block;margin-left:12px;font-size:13px}
  </style>
</head>
<body>
  <main>
    <h1>RDAP, but for Humans settings</h1>
    <p>Choose when RDAP responses are shown in the HUMAN view.</p>
    <form id="settings-form">
      <fieldset>
        <legend>Operating mode</legend>
        <label><input type="radio" name="operatingMode" value="automatic"> Automatic (default)<span>Recognize RDAP responses and show the HUMAN view automatically. Requires access to pages you visit so the extension can identify RDAP responses.</span></label>
        <label><input type="radio" name="operatingMode" value="onDemand"> On demand<span>Leave pages untouched until you click the extension icon on an RDAP response.</span></label>
      </fieldset>
      <button type="submit">Save settings</button><span id="save-status" role="status" aria-live="polite"></span>
    </form>
  </main>
  <script src="src/settings.js"></script>
</body>
</html>
