services:
  rdap-h:
    image: ghcr.io/realvorl/rdap-h:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: rdap-h
    restart: unless-stopped
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
