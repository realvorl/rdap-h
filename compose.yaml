services:
  rdap-human-viewer:
    image: ghcr.io/realvorl/rdap-human-viewer:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: rdap-human-viewer
    restart: unless-stopped
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
